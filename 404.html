<!DOCTYPE html>
<html lang="en" class="scroll-smooth" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Enc-Note — Note Unavailable</title>

  <script src="https://cdn.tailwindcss.com"></script>

  <script>
    tailwind.config = {
      darkMode: "class"
    };
  </script>

  <link
    rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"
    referrerpolicy="no-referrer"
  />
</head>

<body class="min-h-screen bg-slate-50 text-slate-900 dark:bg-slate-950 dark:text-white">

  <div class="pointer-events-none fixed inset-0 -z-10 overflow-hidden">
    <div class="absolute -left-40 -top-40 h-96 w-96 rounded-full bg-blue-500/15 blur-3xl"></div>
    <div class="absolute right-[-8rem] top-40 h-96 w-96 rounded-full bg-emerald-500/10 blur-3xl"></div>
  </div>

  <header class="border-b border-slate-200 bg-white/80 backdrop-blur-xl dark:border-white/10 dark:bg-slate-950/80">
    <div class="mx-auto flex max-w-5xl items-center justify-between px-4 py-4">
      <a href="/" class="flex items-center gap-3">
        <span class="grid h-11 w-11 place-items-center rounded-2xl bg-gradient-to-br from-blue-600 via-sky-500 to-emerald-500 font-black text-white">
          EN
        </span>

        <strong class="text-sm font-black tracking-[0.18em]">
          <span class="text-emerald-500">ENC</span>NOTE
        </strong>
      </a>

      <button
        type="button"
        data-theme-toggle
        class="grid h-11 w-11 place-items-center rounded-2xl border border-slate-200 dark:border-white/10"
      >
        <i data-theme-icon class="fa-solid fa-moon"></i>
      </button>
    </div>
  </header>

  <main class="grid min-h-[75vh] place-items-center px-4 py-16">
    <section class="w-full max-w-2xl rounded-[2rem] border border-slate-200 bg-white/80 p-8 text-center shadow-xl backdrop-blur-xl dark:border-white/10 dark:bg-white/5 sm:p-12">

      <div class="mx-auto grid h-20 w-20 place-items-center rounded-[1.75rem] bg-amber-500/10 text-3xl text-amber-500">
        <i class="fa-solid fa-triangle-exclamation"></i>
      </div>

      <p class="mt-7 text-sm font-black uppercase tracking-[0.18em] text-emerald-500">
        Note unavailable
      </p>

      <h1 class="mt-3 text-4xl font-black tracking-tight sm:text-5xl">
        This secret note isn't available.
      </h1>

      <p class="mx-auto mt-5 max-w-xl leading-8 text-slate-500 dark:text-slate-400">
        The link may be invalid, expired, or the note may have already reached its allowed number of openings.
      </p>

      <div class="mt-8 flex flex-col gap-3 sm:flex-row sm:justify-center">
        <a
          href="/"
          class="inline-flex items-center justify-center gap-2 rounded-2xl bg-gradient-to-r from-blue-600 via-sky-500 to-emerald-500 px-6 py-4 font-extrabold text-white"
        >
          <i class="fa-solid fa-house"></i>
          Back home
        </a>

        <a
          href="/create.html"
          class="inline-flex items-center justify-center gap-2 rounded-2xl border border-slate-200 px-6 py-4 font-bold dark:border-white/10"
        >
          <i class="fa-solid fa-plus"></i>
          Create a secret note
        </a>
      </div>

    </section>
  </main>

  <footer class="pb-8 text-center text-sm text-slate-500 dark:text-slate-400">
    Powered by <strong class="text-slate-800 dark:text-white">Benfei Tech</strong>
  </footer>

  <script src="assets/js/theme.js"></script>
</body>
</html>
