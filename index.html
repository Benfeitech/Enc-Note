<!DOCTYPE html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Enc Note — Secret Messages That Burn Once Read</title>

    <link rel="stylesheet" href="assets/css/index.css" />

    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"
    />

    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  </head>

  <body>
    <div class="bg-glow bg-glow-1"></div>
    <div class="bg-glow bg-glow-2"></div>

    <header class="site-header">
      <a class="brand" href="/">
        <span class="brand-mark">EN</span>
        <span class="brand-text">
          <strong>Enc Note</strong>
          <small>Secret messages with one-time access</small>
        </span>
      </a>

      <button class="theme-toggle" id="themeToggle">
        <i class="fa-solid fa-moon" id="themeIcon"></i>
      </button>
    </header>

    <main class="page-shell">

      <section class="hero-card">
        <h1>Create secret messages that disappear after reading.</h1>
        <p>
          Add a password, set an expiry time, generate a unique link, and let the message burn after the first open.
        </p>
      </section>

      <section class="create-section" id="create">
        <div class="create-grid">

          <!-- FORM -->
          <form class="form-card" id="createNoteForm">

            <div class="field">
              <label>Secret message</label>
              <textarea id="message" rows="7" maxlength="5000" required></textarea>
              <div class="field-meta">
                <span id="charCount">0 / 5000</span>
              </div>
            </div>

            <div class="field-row">
              <div class="field">
                <label>Expiry time</label>
                <select id="expiresIn">
                  <option value="5m">5 minutes</option>
                  <option value="1h" selected>1 hour</option>
                  <option value="24h">24 hours</option>
                </select>
              </div>

              <div class="field">
                <label>Password protection</label>
                <input type="checkbox" id="passwordOption" />
              </div>
            </div>

            <div class="field hidden" id="passwordFieldWrap">
              <label>Password</label>
              <div class="password-input">
                <input type="password" id="password" />
                <button type="button" id="passwordToggleBtn">
                  <i class="fa-regular fa-eye" id="passwordToggleIcon"></i>
                </button>
              </div>
            </div>

            <div class="form-actions">
              <button class="btn primary" type="submit" id="submitBtn">
                Create link
              </button>
              <button class="btn secondary" type="button" id="resetBtn">
                Reset
              </button>
            </div>
          </form>

          <!-- RESULT -->
          <aside class="status-card">

            <div id="resultBox">
              <div id="resultEmpty">
                <p>Your link will appear here</p>
              </div>

              <div id="resultSuccess" class="hidden">
                <p id="generatedLink"></p>

                <div class="result-actions">
                  <button id="openLinkBtn" class="btn secondary">Open</button>
                  <button id="copyLinkBtn" class="btn primary">Copy</button>
                </div>
              </div>
            </div>

          </aside>
        </div>
      </section>

      <!-- ✅ FOLLOW SECTION UPDATED -->
      <section class="follow-section">
        <p class="follow-title">Follow our social handles</p>

        <div class="social-strip">
          <a href="#"><i class="fa-brands fa-youtube"></i></a>
          <a href="#"><i class="fa-brands fa-whatsapp"></i></a>
          <a href="#"><i class="fa-brands fa-telegram"></i></a>
          <a href="#"><i class="fa-brands fa-github"></i></a>
          <a href="#"><i class="fa-brands fa-linkedin-in"></i></a>
        </div>
      </section>

    </main>

    <footer class="site-footer">
      <p>Powered by <strong>Benfei Tech</strong></p>
    </footer>

    <script src="assets/js/app.js"></script>
  </body>
</html>
